spring:
  application:
    name: taskly
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/taskly;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
server:
  port: ${PORT:8080}